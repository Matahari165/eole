<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="eole-title">
  <title id="eole-title">Eole</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f7fcfd"/>
      <stop offset="100%" stop-color="#e8f6f9"/>
    </radialGradient>
    <linearGradient id="orb" x1="30%" y1="10%" x2="70%" y2="90%">
      <stop offset="0%" stop-color="#35b7ca"/>
      <stop offset="52%" stop-color="#0d8fa5"/>
      <stop offset="100%" stop-color="#075e77"/>
    </linearGradient>
    <radialGradient id="glow" cx="42%" cy="36%" r="44%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <filter id="halo">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="42" fill="url(#orb)" filter="url(#halo)"/>
  <circle cx="64" cy="64" r="42" fill="url(#glow)"/>
  <circle cx="64" cy="64" r="45" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  <path d="M28 64 C40 48, 52 48, 64 64 S88 80, 100 64" fill="none" stroke="rgba(255,255,255,0.92)" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M28 64 C40 48, 52 48, 64 64 S88 80, 100 64" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="8" stroke-linecap="round" filter="url(#halo)"/>
</svg>
